<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talyson & Mikaelly</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <div id="welcome-overlay" class="welcome-overlay">
        <div class="welcome-content">
            <p class="welcome-subtitle">Uma história de amor escrita por Deus</p>
            <h2 class="welcome-title">Talyson & Mikaelly</h2>
            <div class="welcome-divider"></div>
            <button id="start-button" class="start-btn">Abrir</button>
        </div>
    </div>

    <audio id="background-music" loop>
        <source src="./music/nossa-musica.mp3" type="audio/mpeg">
    </audio>

    <button id="music-control" class="music-btn">
        <span id="music-icon">🎵</span>
    </button>
    <div class="hearts-container" id="hearts-container"></div>

    <section class="hero">
        <div class="hero-content">
            <p class="subtitle">Nossa História Continua</p>
            <p> O amor é a base de tudo. Cada segundo ao seu lado é um presente, e cada momento se torna eterno quando estamos juntos.</p>
            <h1>Talyson & Mikaelly</h1>
            <div class="divider"></div>

            <div class="counter-minimal">
                <div class="unit"><span id="years">00</span><label>Anos</label></div>
                <div class="unit"><span id="months">00</span><label>Meses</label></div>
                <div class="unit"><span id="days">00</span><label>Dias</label></div>
                <div class="unit"><span id="hours">00</span><label>Horas</label></div>
                <div class="unit"><span id="minutes">00</span><label>Min</label></div>
                <div class="unit"><span id="seconds">00</span><label>Seg</label></div>
            </div>
        </div>
        <main class="content-wrapper">
            <section class="slider-section">
                <div class="slider-container">
                    <div class="slides" id="slider">
                        <div class="slide active"><img src="./imagens/Mikaely e Talyson .JPG"></div>
                        <div class="slide"><img src="./imagens/Mikaely e Talyson (304).JPG"></div>
                        <div class="slide"><img src="./imagens/Mikaely e Talyson (428).JPG"></div>
                        <div class="slide"><img src="./imagens/Mikaely e Talyson (11).JPG"></div>
                        <div class="slide"><img src="./imagens/Mikaely e Talyson (19).JPG"></div>
                        <div class="slide"><img src="./imagens/Mikaely e Talyson (6).JPG"></div>
                        <div class="slide"><img src="./imagens/Mikaely e Talyson (200).JPG"></div>
                        <div class="slide"><img src="./imagens/Mikaely e Talyson (354).JPG"></div>
                        <div class="slide"><img src="./imagens/Mikaely e Talyson (420).JPG"></div>
                    </div>
                    <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
                    <button class="next" onclick="changeSlide(1)">&#10095;</button>
                </div>
            </section>

            <section class="video-section">
                <a href="https://www.youtube.com/watch?v=0J7kdE_-3Gc" target="_blank" class="video-link-card">
                    <div class="video-overlay">
                        <div class="play-btn"></div>
                        <span>ASSISTIR VÍDEO NO YOUTUBE</span>
                    </div>
                    <img src="./imagens/Mikaely e Talyson (304).JPG" alt="Capa do Vídeo">
                </a>
            </section>
        </main>
    </section>



    <script src="script.js"></script>
</body>

</html>
